<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Venue form | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/events.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('venues')}"></div>

<main>
    <div class="container">

        <div class="card form-card">
            <h1 th:text="${venueId == null} ? 'Add a venue' : 'Edit venue'"></h1>

            <form th:action="${venueId == null} ? @{/venues} : @{/venues/{id}(id=${venueId})}"
                  th:method="${venueId == null} ? 'post' : 'put'"
                  th:object="${venueForm}" novalidate>

                <div class="form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                    <label for="name">Venue name</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="e.g. Sofia Tech Park">
                    <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="form-row">
                    <div class="form-group" th:classappend="${#fields.hasErrors('city')} ? 'has-error'">
                        <label for="city">City</label>
                        <input type="text" id="city" th:field="*{city}" placeholder="e.g. Sofia">
                        <div class="error-text" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('capacity')} ? 'has-error'">
                        <label for="capacity">Capacity</label>
                        <input type="number" id="capacity" th:field="*{capacity}" min="1" max="100000" placeholder="e.g. 100">
                        <div class="error-text" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                    </div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('address')} ? 'has-error'">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" placeholder="Street and number">
                    <div class="error-text" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"
                            th:text="${venueId == null} ? 'Create venue' : 'Save changes'"></button>
                    <a th:href="@{/venues}" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
