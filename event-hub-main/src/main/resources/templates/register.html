<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<main>
    <div class="container">

        <div class="auth-wrapper">

            <div class="card auth-card">

                <h1>Create your account</h1>
                <p class="subtitle">It takes less than a minute.</p>

                <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

                <form th:action="@{/register}" th:object="${userRegisterRequest}" method="post" novalidate>

                    <div class="form-group" th:classappend="${#fields.hasErrors('username')} ? 'has-error'">
                        <label for="username">Username</label>
                        <input type="text" id="username" th:field="*{username}" placeholder="e.g. dev42">
                        <div class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="Enter your email address">
                        <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                        <label for="password">Password</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="At least 8 characters">
                        <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Repeat your password">
                        <div class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        <div class="error-text" th:if="${#fields.hasErrors('passwordMatching')}" th:errors="*{passwordMatching}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('role')} ? 'has-error'">

                        <label>I want to join as</label>

                        <div class="role-options">
                            <label class="role-option">
                                <input type="radio" th:field="*{role}" value="ATTENDEE">
                                <strong>Attendee</strong>
                                <span>Browse and book events</span>
                            </label>
                            <label class="role-option">
                                <input type="radio" th:field="*{role}" value="ORGANIZER">
                                <strong>Organizer</strong>
                                <span>Create and manage events</span>
                            </label>
                        </div>

                        <div class="error-text" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Register</button>

                </form>

                <p class="auth-footer">Already registered? <a th:href="@{/login}">Log in</a></p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
