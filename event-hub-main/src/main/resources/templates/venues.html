<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Venues | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/events.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('venues')}"></div>

<main>
    <div class="container">

        <div class="page-header">
            <div>
                <h1>Venues</h1>
                <p>Places where your events take place.</p>
            </div>
            <a th:href="@{/venue-form}" class="btn btn-primary">+ New venue</a>
        </div>

        <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

        <div class="table-wrap" th:if="${!#lists.isEmpty(venues)}">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>City</th>
                    <th>Address</th>
                    <th>Capacity</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="venue : ${venues}">
                    <td><strong th:text="${venue.name}"></strong></td>
                    <td th:text="${venue.city}"></td>
                    <td th:text="${venue.address}"></td>
                    <td th:text="${venue.capacity}"></td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/venues/{id}/edit(id=${venue.id})}" class="btn btn-outline btn-sm">Edit</a>
                            <form th:action="@{/venues/{id}(id=${venue.id})}" th:method="delete"
                                  onsubmit="return confirm('Are you sure you want to delete this venue?');">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(venues)}">
            <h3>No venues yet</h3>
            <p>Add a venue before creating your first event.</p>
            <a th:href="@{/venue-form}" class="btn btn-primary">Add venue</a>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
