<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('login')}"></div>

<main>
    <div class="container">

        <div class="auth-wrapper">

            <div class="card auth-card">

                <h1>Welcome back</h1>
                <p class="subtitle">Log in to book events or manage your own.</p>

                <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

                <form th:action="@{/login}" th:object="${userLoginRequest}" method="post" novalidate>

                    <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="Enter your email address">
                        <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                        <label for="password">Password</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="Your password">
                        <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Log in</button>

                </form>

                <p class="auth-footer">New here? <a th:href="@{/register}">Create an account</a></p>

            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
