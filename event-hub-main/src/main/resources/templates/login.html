<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('login')}"></div>

<main>
    <div class="container">

        <div class="auth-wrapper">

            <div class="card auth-card">

                <h1>Welcome back</h1>
                <p class="subtitle">Log in to book events or manage your own.</p>

                <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

                <form th:action="@{/login}" method="post">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Log in</button>

                </form>

                <p class="auth-footer">New here? <a th:href="@{/register}">Create an account</a></p>

            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
