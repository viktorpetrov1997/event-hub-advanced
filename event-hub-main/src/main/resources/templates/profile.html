<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('profile')}"></div>

<main>
    <div class="container">

        <div class="auth-wrapper">

            <div class="card auth-card">

                <h1>My profile</h1>
                <p class="subtitle">Your account details.</p>

                <div class="form-group">
                    <label>Username</label>
                    <p th:text="${user.username}"></p>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <p th:text="${user.email}"></p>
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <p><span class="badge badge-primary" th:text="${user.role}"></span></p>
                </div>

                <a th:href="@{/profile/edit}" class="btn btn-primary btn-block">Edit profile</a>

            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
