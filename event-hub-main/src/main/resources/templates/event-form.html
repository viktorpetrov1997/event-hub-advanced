<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event form | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/events.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar(${eventId == null ? 'event-form' : ''})}"></div>

<main>
    <div class="container">

        <div class="card form-card">

            <h1 th:text="${eventId == null} ? 'Create a new event' : 'Edit event'"></h1>

            <form th:action="${eventId == null} ? @{/events} : @{/events/{id}(id=${eventId})}"
                  th:method="${eventId == null} ? 'post' : 'put'"
                  th:object="${eventForm}" novalidate>

                <input type="hidden" name="redirectTo" th:value="${redirectTo}">

                <div class="form-group" th:classappend="${#fields.hasErrors('title')} ? 'has-error'">
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}" placeholder="e.g. Tech & Innovation Summit">
                    <div class="error-text" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" placeholder="What will attendees learn or experience?"></textarea>
                    <div class="error-text" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="form-row">
                    <div class="form-group" th:classappend="${#fields.hasErrors('startTime')} ? 'has-error'">
                        <label for="startTime">Starts</label>
                        <input type="datetime-local" id="startTime" th:field="*{startTime}">
                        <div class="error-text" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('endTime') or #fields.hasErrors('endTimeAfterStartTime')} ? 'has-error'">
                        <label for="endTime">Ends</label>
                        <input type="datetime-local" id="endTime" th:field="*{endTime}">
                        <div class="error-text" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
                        <div class="error-text" th:if="${#fields.hasErrors('endTimeAfterStartTime')}" th:errors="*{endTimeAfterStartTime}"></div>
                    </div>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('venueId')} ? 'has-error'">

                    <label for="venueId">Venue</label>

                    <select id="venueId" th:field="*{venueId}">
                        <option value="">-- Select a venue --</option>
                        <option th:each="venue : ${venues}" th:value="${venue.id}"
                                th:text="${venue.name + ' – ' + venue.city + ' (capacity ' + venue.capacity + ')'}">
                        </option>
                    </select>

                    <div class="hint" th:if="${#lists.isEmpty(venues)}">
                        There are no venues yet.
                        <a th:href="@{/venue-form}">Create a venue</a> first, then come back to create your event.
                    </div>

                    <div class="hint" th:unless="${#lists.isEmpty(venues)}">A venue can host only one event at a time.</div>

                    <div class="error-text" th:if="${#fields.hasErrors('venueId')}" th:errors="*{venueId}"></div>

                </div>

                <div class="form-row">
                    <div class="form-group" th:classappend="${#fields.hasErrors('price')} ? 'has-error'">
                        <label for="price">Price (€)</label>
                        <input type="number" id="price" th:field="*{price}" step="1" min="0" placeholder="0.00">
                        <div class="hint">Use 0 for a free event.</div>
                        <div class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('capacity')} ? 'has-error'">
                        <label for="capacity">Capacity (seats)</label>
                        <input type="number" id="capacity" th:field="*{capacity}" step="1" min="1" placeholder="e.g. 50">
                        <div class="hint">Cannot exceed the venue capacity.</div>
                        <div class="error-text" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:.5rem;font-weight:500;">
                        <input type="checkbox" th:field="*{published}" style="width:auto;" checked>
                        Publish immediately (visible to attendees)
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"
                            th:text="${eventId == null} ? 'Create event' : 'Save changes'"></button>

                    <a th:href="@{/events}" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
