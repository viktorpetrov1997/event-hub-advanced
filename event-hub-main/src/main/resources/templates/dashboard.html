<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('dashboard')}"></div>

<main>
    <div class="container">

        <div class="page-header">
            <div>
                <h1>Organizer dashboard</h1>
                <p>An overview of your events and bookings.</p>
            </div>
            <a th:href="@{/event-form}" class="btn btn-primary">+ New event</a>
        </div>

        <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

        <div class="stat-grid">

            <div class="card stat-card primary">
                <div class="stat-label">Total events</div>
                <div class="stat-value" th:text="${totalEvents}"></div>
            </div>

            <div class="card stat-card success">
                <div class="stat-label">Published</div>
                <div class="stat-value" th:text="${publishedEvents}"></div>
            </div>

            <div class="card stat-card accent">
                <div class="stat-label">Seats booked</div>
                <div class="stat-value" th:text="${soldSeats}"></div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">Revenue</div>
                <div class="stat-value" th:text="${#numbers.formatDecimal(revenue, 1, 'COMMA', 2, 'POINT') + ' €'}"></div>
            </div>

        </div>

        <div class="section-title" th:if="${!#lists.isEmpty(events)}">
            <h2>My events</h2>
        </div>

        <div class="table-wrap" th:if="${!#lists.isEmpty(events)}">
            <table>
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Venue</th>
                    <th>Seats</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events}">
                    <td>
                        <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.title}"></a>
                    </td>

                    <td style="text-transform: capitalize" th:text="${#temporals.format(event.startTime, 'dd MMM yyyy, HH:mm') + ' – '
                                  + (event.startTime.toLocalDate() == event.endTime.toLocalDate()
                                        ? #temporals.format(event.endTime, 'HH:mm')
                                        : #temporals.format(event.endTime, 'dd MMM yyyy, HH:mm'))}"></td>

                    <td th:text="${event.venue.name}">Venue</td>

                    <td th:text="${bookedSeatsByEvent[event.id]} + ' / ' + ${event.capacity}"></td>

                    <td>
                        <span th:if="${event.published}" class="badge badge-success">Published</span>
                        <span th:unless="${event.published}" class="badge badge-warning">Hidden</span>
                    </td>

                    <td>
                        <div class="actions">
                            <a th:if="${event.startTime.isAfter(T(java.time.LocalDateTime).now())}"
                               th:href="@{/events/{id}/edit(id=${event.id}, redirectTo='dashboard')}" class="btn btn-outline btn-sm">Edit</a>

                            <form th:if="${event.endTime.isAfter(T(java.time.LocalDateTime).now())}"
                                  th:action="@{/events/{id}/visibility(id=${event.id})}" th:method="put" style="display:inline;">
                                <input type="hidden" name="redirectTo" value="dashboard">
                                <button type="submit" class="btn btn-secondary btn-sm"
                                        th:text="${event.published} ? 'Hide' : 'Publish'"></button>
                            </form>

                            <form th:if="${!hasActiveBookingsByEvent[event.id]}" th:action="@{/events/{id}(id=${event.id})}"
                                  th:method="delete" style="display:inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this event? This cannot be undone.');">
                                <input type="hidden" name="redirectTo" value="dashboard">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(events)}" class="empty-state">
            <p>You have not created any events yet.</p>
            <a th:href="@{/event-form}" class="btn btn-primary">Create your first event</a>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
