<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My bookings | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/events.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('my-bookings')}"></div>

<main>
    <div class="container">

        <div class="page-header">
            <div>
                <h1>My bookings</h1>
                <p>All the events you have reserved seats for.</p>
            </div>
            <a th:href="@{/events}" class="btn btn-primary">Browse events</a>
        </div>

        <th:block th:replace="~{fragments/alerts :: alerts}"></th:block>

        <div class="table-wrap" th:if="${!#lists.isEmpty(bookings)}">
            <table>
                <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Seats</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td><a th:href="@{/events/{id}(id=${booking.event.id})}" th:text="${booking.event.title}"></a></td>

                    <td style="text-transform: capitalize" th:text="${#temporals.format(booking.event.startTime, 'dd MMMM yyyy, HH:mm')}"></td>

                    <td th:text="${booking.seats}"></td>

                    <td th:text="${booking.totalPrice == 0} ? 'Free' : ${#numbers.formatDecimal(booking.totalPrice, 1, 2)} + ' €'"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'badge-success' : 'badge-danger'"
                              th:text="${booking.status}">
                        </span>
                    </td>

                    <td>
                        <div class="actions">
                            <a th:href="@{/events/{id}(id=${booking.event.id})}" class="btn btn-secondary btn-sm">View</a>

                            <form th:if="${booking.user.id == #authentication.principal.id and booking.status.name() == 'CONFIRMED'
                                    and booking.event.startTime.isAfter(T(java.time.LocalDateTime).now())}"
                                    th:action="@{/bookings/{id}/cancel(id=${booking.id})}"
                                    th:method="put" onsubmit="return confirm('Are you sure you want to cancel this booking?');">

                                <button type="submit" class="btn btn-danger btn-sm">Cancel</button>
                            </form>

                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(bookings)}">
            <h3>No bookings yet</h3>
            <p>When you book an event it will show up here.</p>
            <a th:href="@{/events}" class="btn btn-primary">Find an event</a>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
