# Application Configuration
spring.application.name=EventHub

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/eventhub?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Logging Configuration
logging.level.org.hibernate.persister.entity=ERROR

# Spring MVC Configuration
spring.mvc.hiddenmethod.filter.enabled=true

# Session Configuration
server.servlet.session.tracking-modes=cookie

# Default Admin Configuration
eventhub.admin.username=${ADMIN_USERNAME:admin}
eventhub.admin.email=${ADMIN_EMAIL:admin@eventhub.com}
eventhub.admin.password=${ADMIN_PASSWORD}


